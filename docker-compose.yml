services:
  cloakbrowser-mcp:
    build: .
    container_name: cloakbrowser-mcp
    environment:
      # CloakBrowser (CDP backend)
      - CDP_HOST=0.0.0.0
      - CDP_PORT=9222
      - HEADLESS=true
      - PROXY_SERVER=
      # @playwright/mcp (MCP frontend)
      - MCP_HOST=0.0.0.0
      - MCP_PORT=3000
      # Optional flags — uncomment to enable:
      # - MCP_ISOLATED=
      # - STORAGE_STATE=
      # - USER_DATA_DIR=
      # - VIEWPORT_SIZE=
      # - DEVICE=
      # - USER_AGENT=
      # - CAPS=
      # - PROXY_BYPASS=
      # - TIMEOUT_ACTION=
      # - TIMEOUT_NAVIGATION=
      # - CONSOLE_LEVEL=
      # - IGNORE_HTTPS_ERRORS=false
      # - BLOCK_SERVICE_WORKERS=false
      # - BLOCKED_ORIGINS=
      # - ALLOWED_ORIGINS=
      # - GRANT_PERMISSIONS=
      # - SAVE_SESSION=false
      # - OUTPUT_DIR=
      # - INIT_SCRIPT=
      # - INIT_PAGE=
      # - SECRETS_FILE=
      # Additional @playwright/mcp flags
      # - ALLOW_UNRESTRICTED_FILE_ACCESS=false
      # - BROWSER=
      # - CDP_HEADERS=
      # - CDP_TIMEOUT=
      # - CODEGEN=
      # - MCP_CONFIG=
      # - EXECUTABLE_PATH=
      # - EXTENSION=false
      # - MCP_HEADLESS=
      # - IMAGE_RESPONSES=
      # - NO_SANDBOX=false
      # - OUTPUT_MODE=
      # - MCP_PROXY_SERVER=
      # - SANDBOX=false
      # - SHARED_BROWSER_CONTEXT=false
      # - SNAPSHOT_MODE=
      # - TEST_ID_ATTRIBUTE=
    ports:
      - "9222:9222"   # CDP (прямой доступ для отладки)
      - "3000:3000"   # MCP Server-Sent Events
    restart: unless-stopped
    # volumes:
    #   - ./storage-state.json:/app/storage-state.json
    # environment:
    #   - STORAGE_STATE=/app/storage-state.json
