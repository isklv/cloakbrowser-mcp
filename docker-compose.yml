services:
  cloakbrowser-mcp:
    build: .
    container_name: cloakbrowser-mcp
    environment:
      - CDP_PORT=8931
      - MCP_PORT=3000
      - HEADLESS=true
      - PROXY_SERVER=
      - ISOLATED=false
    ports:
      - "8931:8931"   # CDP (прямой доступ для отладки)
      - "3000:3000"   # MCP Server-Sent Events
    restart: unless-stopped
    # volumes:
    #   - ./storage-state.json:/app/storage-state.json
    # environment:
    #   - STORAGE_STATE=/app/storage-state.json
